name: FinQuery RAG Backend CI

on:
  pull_request:
    paths:
      - finquery_rag/backend/**
      - finquery_rag/.gitattributes
      - finquery_rag/.gitignore
      - .github/workflows/finquery-rag-backend.yml
  push:
    branches:
      - master
      - main
      - cc/rag-production-review
    paths:
      - finquery_rag/backend/**
      - finquery_rag/.gitattributes
      - finquery_rag/.gitignore
      - .github/workflows/finquery-rag-backend.yml

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # uv resolves its interpreter from `.python-version`, and this repository
      # has two that disagree: the root's says 3.10 and `finquery_rag/`'s says
      # 3.13, while this job's setup-python installs 3.12 and pyproject requires
      # >=3.12. With no satisfying interpreter on the runner, uv downloads the
      # newest release instead -- CPython 3.14 -- where `onnxruntime` publishes
      # no wheel and `uv sync` fails outright:
      #
      #   error: Distribution `onnxruntime==1.23.2` can't be installed because
      #   it doesn't have a source distribution or wheel for the current platform
      #   hint: You're using CPython 3.14 (`cp314`), but `onnxruntime` (v1.23.2)
      #   only has wheels with the following Python ABI tags: cp312, cp313, cp313t
      #
      # Pinning it explicitly makes the build independent of which interpreter
      # the runner happens to expose, and keeps CI on the 3.12 every sealed
      # measurement was produced on.
      UV_PYTHON: "3.12"

    defaults:
      run:
        working-directory: finquery_rag/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libgl1 poppler-utils

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: finquery_rag/backend/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Compile Python files
        run: uv run --with pytest python -m compileall -q src tests scripts

      # The historical evaluation suites below require generated local artifacts
      # that are intentionally not part of a clean checkout. Keep them in
      # dedicated offline/evaluation runs; this step covers backend regressions.
      - name: Run backend tests
        env:
          FINANCIAL_RUNTIME_MODE: v1
          MULTITURN_CONTEXT_MODE: off
        run: >
          uv run --with pytest python -m pytest -q
          --ignore=tests/evaluation
          --ignore=tests/pdf_retrieval_v4
          --ignore=tests/rag_v2/test_nf_v2_02_top20_financial_fact.py

      - name: Run TV2-08 official activation tests
        env:
          FINANCIAL_RUNTIME_MODE: v2
          MULTITURN_CONTEXT_MODE: on
        run: >
          uv run --with pytest python -m pytest -q
          tests/test_tv2_08_production_integration.py
          tests/test_runtime_router_shadow.py
          tests/test_runtime_router_api_shadow.py
          tests/test_tv2_07_readiness.py
          tests/test_tv2_07_r1_readiness.py
          tests/evaluation/test_deterministic_runtime.py

      - name: Run eval gate smoke
        env:
          FINQUERY_EVAL_ARTIFACT_DIR: /tmp/finquery_eval_artifacts
        run: uv run python scripts/ci_eval_gate.py

      - name: Upload eval gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finquery-eval-gate
          path: /tmp/finquery_eval_artifacts
          if-no-files-found: ignore

      - name: Run deployment preflight smoke
        env:
          FINQUERY_PREFLIGHT_ARTIFACT_DIR: /tmp/finquery_preflight_artifacts
        run: uv run python scripts/ci_preflight_smoke.py

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finquery-preflight
          path: /tmp/finquery_preflight_artifacts
          if-no-files-found: ignore
