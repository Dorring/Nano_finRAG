<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Card Drop Shadow -->
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748B" flood-opacity="0.08" />
    </filter>

    <!-- Flow Markers -->
    <marker id="arrBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arrIndigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4F46E5" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B" />
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .card-title { font-size: 14px; font-weight: 800; letter-spacing: -0.2px; }
    .item-text { font-size: 11.5px; font-weight: 500; fill: #334155; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="680" rx="16" fill="url(#archBg)" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="365" x2="1200" y2="365" />
    <line x1="395" y1="75" x2="395" y2="680" />
    <line x1="795" y1="75" x2="795" y2="680" />
  </g>

  <!-- Header Section -->
  <g transform="translate(45, 22)">
    <!-- Badge -->
    <rect width="165" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <circle cx="15" cy="14" r="4.5" fill="#2563EB" />
    <text x="27" y="18.5" class="sans" font-size="11.5" font-weight="700" fill="#1E40AF">V2 PIPELINE ENGINE</text>

    <text x="180" y="20" class="sans" font-size="20" font-weight="900" fill="#0F172A">Nano_finRAG Production Architecture &amp; Execution Pipeline</text>
    <text x="180" y="38" class="sans" font-size="12" font-weight="500" fill="#64748B">Zero-Hallucination SEC Financial QA: Contract Binding, Deterministic Math &amp; Safe Refusal Gate</text>
  </g>

  <!-- ==================== ROW 1: Stages 1, 2, 3 ==================== -->

  <!-- STAGE 1: Multi-Turn Context & Query Rewriter -->
  <g transform="translate(45, 95)" filter="url(#boxShadow)">
    <rect width="320" height="245" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect width="320" height="4" rx="2" fill="#2563EB" />
    
    <!-- Stage Header with Chat/Rewrite Icon -->
    <g transform="translate(18, 18)">
      <circle cx="16" cy="16" r="16" fill="#EFF6FF" />
      <path d="M 9 11 C 9 8.5 11 7 14 7 L 19 7 C 22 7 24 8.5 24 11 L 24 16 C 24 18.5 22 20 19 20 L 17 20 L 13 23 L 13 20 L 12 20 C 10 20 9 18.5 9 16 Z" fill="#2563EB" />
      <text x="42" y="14" class="sans" font-size="10.5" font-weight="800" fill="#2563EB">STAGE 01</text>
      <text x="42" y="27" class="sans card-title" fill="#0F172A">Context &amp; Query Rewrite</text>
    </g>

    <!-- Visual Items -->
    <g transform="translate(18, 68)">
      <g transform="translate(0, 0)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#3B82F6" />
        <text x="32" y="21" class="sans item-text" font-weight="600">Multi-Turn Session Context</text>
        <text x="210" y="21" class="mono" font-size="10" font-weight="700" fill="#2563EB">Live Path</text>
      </g>

      <g transform="translate(0, 42)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#6366F1" />
        <text x="32" y="21" class="sans item-text" font-weight="600">Pronoun Resolution &amp; Anchor</text>
        <text x="215" y="21" class="mono" font-size="10" font-weight="700" fill="#4F46E5">Resolved</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#0D9488" />
        <text x="32" y="21" class="sans item-text" font-weight="600">Standalone Query Synthesis</text>
        <text x="218" y="21" class="mono" font-size="10" font-weight="700" fill="#0D9488">Rewritten</text>
      </g>

      <g transform="translate(0, 126)">
        <rect width="284" height="30" rx="6" fill="#EFF6FF" />
        <text x="12" y="19" class="sans" font-size="11" font-weight="600" fill="#1D4ED8">
          Token Budgeting &amp; Noise Denoising
        </text>
      </g>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 365 215 L 435 215" stroke="#2563EB" stroke-width="2" marker-end="url(#arrBlue)" />

  <!-- STAGE 2: Multi-Track Retrieval & Structured Rerank -->
  <g transform="translate(440, 95)" filter="url(#boxShadow)">
    <rect width="320" height="245" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect width="320" height="4" rx="2" fill="#4F46E5" />
    
    <!-- Header with Radar / Multi-Track Icon -->
    <g transform="translate(18, 18)">
      <circle cx="16" cy="16" r="16" fill="#EEF2FF" />
      <circle cx="16" cy="16" r="11" fill="none" stroke="#4F46E5" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="#4F46E5" />
      <text x="42" y="14" class="sans" font-size="10.5" font-weight="800" fill="#4F46E5">STAGE 02</text>
      <text x="42" y="27" class="sans card-title" fill="#0F172A">Multi-Track Retrieval</text>
    </g>

    <!-- Visual Track Items -->
    <g transform="translate(18, 68)">
      <g transform="translate(0, 0)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#2563EB">Track A</text>
        <text x="72" y="21" class="sans item-text">BM25 Lexical (Exact Terms)</text>
      </g>

      <g transform="translate(0, 42)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="21" class="mono" font-size="11" font-weight="700" fill="#7C3AED">Track B</text>
        <text x="72" y="21" class="sans item-text">Dense Embedding (Semantics)</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="284" height="36" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2" />
        <text x="12" y="22" class="mono" font-size="11" font-weight="800" fill="#4338CA">Track C</text>
        <text x="70" y="22" class="sans" font-size="11.5" font-weight="700" fill="#312E81">Structured Candidate Rerank</text>
        <rect x="230" y="7" width="46" height="20" rx="4" fill="#4F46E5" />
        <text x="235" y="21" class="mono" font-size="9" font-weight="800" fill="#FFFFFF">85.3%</text>
      </g>

      <g transform="translate(0, 128)">
        <rect width="284" height="28" rx="6" fill="#F1F5F9" />
        <text x="14" y="18" class="sans" font-size="10.5" font-weight="600" fill="#475569">
          Reciprocal Rank Fusion (RRF k=60)
        </text>
      </g>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 760 215 L 830 215" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrIndigo)" />

  <!-- STAGE 3: Evidence Binder & Uniqueness Guard -->
  <g transform="translate(835, 95)" filter="url(#boxShadow)">
    <rect width="320" height="245" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect width="320" height="4" rx="2" fill="#0D9488" />
    
    <!-- Header with Table / Alignment Icon -->
    <g transform="translate(18, 18)">
      <circle cx="16" cy="16" r="16" fill="#F0FDFA" />
      <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#0D9488" stroke-width="1.5" />
      <line x1="9" y1="16" x2="23" y2="16" stroke="#0D9488" stroke-width="1" />
      <line x1="16" y1="9" x2="16" y2="23" stroke="#0D9488" stroke-width="1" />
      <text x="42" y="14" class="sans" font-size="10.5" font-weight="800" fill="#0D9488">STAGE 03</text>
      <text x="42" y="27" class="sans card-title" fill="#0F172A">Evidence Binder &amp; Align</text>
    </g>

    <!-- Visual Items -->
    <g transform="translate(18, 68)">
      <g transform="translate(0, 0)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#0D9488" />
        <text x="32" y="21" class="sans item-text" font-weight="600">Coordinate (Entity, Metric, Period)</text>
      </g>

      <g transform="translate(0, 42)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#10B981" />
        <text x="32" y="21" class="sans item-text" font-weight="600">1-to-1 Slot Evidence Mapping</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="284" height="34" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#F59E0B" />
        <text x="32" y="21" class="sans" font-size="11.5" font-weight="700" fill="#92400E">Adaptive Replan Loop (Max 2)</text>
      </g>

      <g transform="translate(0, 126)">
        <rect width="284" height="30" rx="6" fill="#F1F5F9" />
        <text x="12" y="19" class="sans" font-size="10.5" font-weight="600" fill="#475569">
          Targeted Re-fetch on Missing Slot
        </text>
      </g>
    </g>
  </g>

  <!-- Flow Connector Down: Stage 3 to Row 2 -->
  <path d="M 995 340 L 995 375 L 995 405" stroke="#0D9488" stroke-width="2" marker-end="url(#arrGreen)" />

  <!-- ==================== ROW 2: Stages 4, 5, 6 ==================== -->

  <!-- STAGE 4: Deterministic Decimal Calculator -->
  <g transform="translate(45, 415)" filter="url(#boxShadow)">
    <rect width="320" height="235" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect width="320" height="4" rx="2" fill="#7C3AED" />
    
    <!-- Header with Calculator Icon -->
    <g transform="translate(18, 18)">
      <circle cx="16" cy="16" r="16" fill="#F5F3FF" />
      <rect x="10" y="7" width="12" height="18" rx="2" fill="none" stroke="#7C3AED" stroke-width="1.5" />
      <line x1="12" y1="11" x2="20" y2="11" stroke="#7C3AED" stroke-width="1" />
      <circle cx="13" cy="15" r="0.8" fill="#7C3AED" />
      <circle cx="16" cy="15" r="0.8" fill="#7C3AED" />
      <circle cx="19" cy="15" r="0.8" fill="#7C3AED" />
      <circle cx="13" cy="19" r="0.8" fill="#7C3AED" />
      <circle cx="16" cy="19" r="0.8" fill="#7C3AED" />
      <circle cx="19" cy="19" r="0.8" fill="#7C3AED" />
      <text x="42" y="14" class="sans" font-size="10.5" font-weight="800" fill="#7C3AED">STAGE 04</text>
      <text x="42" y="27" class="sans card-title" fill="#0F172A">Deterministic Calculator</text>
    </g>

    <!-- Visual Items -->
    <g transform="translate(18, 68)">
      <g transform="translate(0, 0)">
        <rect width="284" height="34" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#7C3AED" />
        <text x="32" y="21" class="sans" font-size="11.5" font-weight="700" fill="#5B21B6">Python Decimal (9 Ops)</text>
        <text x="210" y="21" class="mono" font-size="10" font-weight="700" fill="#7C3AED">Exact Math</text>
      </g>

      <g transform="translate(0, 42)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#EF4444" />
        <text x="32" y="21" class="sans item-text" font-weight="600">LLM Barred from Arithmetic</text>
        <text x="220" y="21" class="mono" font-size="10" font-weight="700" fill="#EF4444">No Drift</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#059669" />
        <text x="32" y="21" class="sans item-text" font-weight="600">Units &amp; Scale Normalization</text>
        <text x="225" y="21" class="mono" font-size="10" font-weight="700" fill="#059669">$ / M / B</text>
      </g>

      <g transform="translate(0, 126)">
        <rect width="284" height="24" rx="5" fill="#F1F5F9" />
        <text x="12" y="16" class="sans" font-size="10" font-weight="600" fill="#475569">
          Exact arithmetic + scale factor preservation
        </text>
      </g>
    </g>
  </g>

  <!-- Arrow 3 to 4 connector line -->
  <path d="M 835 470 L 375 470" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrIndigo)" />

  <!-- STAGE 5: Dual Verification Gatekeeper -->
  <g transform="translate(440, 415)" filter="url(#boxShadow)">
    <rect width="320" height="235" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect width="320" height="4" rx="2" fill="#F59E0B" />
    
    <!-- Header with Shield Scanner Icon -->
    <g transform="translate(18, 18)">
      <circle cx="16" cy="16" r="16" fill="#FFFBEB" />
      <path d="M 16 8 L 23 11 L 23 17 C 23 22 16 25 16 25 C 16 25 9 22 9 17 L 9 11 Z" fill="#F59E0B" />
      <path d="M 13 16 L 15 18 L 19 14" stroke="#FFFFFF" stroke-width="1.5" fill="none" />
      <text x="42" y="14" class="sans" font-size="10.5" font-weight="800" fill="#B45309">STAGE 05</text>
      <text x="42" y="27" class="sans card-title" fill="#0F172A">Dual Verification Gate</text>
    </g>

    <!-- Visual Items -->
    <g transform="translate(18, 68)">
      <g transform="translate(0, 0)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#2563EB" />
        <text x="32" y="21" class="sans item-text" font-weight="600">Numeric Payload Integrity Audit</text>
      </g>

      <g transform="translate(0, 42)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#7C3AED" />
        <text x="32" y="21" class="sans item-text" font-weight="600">96.0% Citation Fidelity Guard</text>
      </g>

      <g transform="translate(0, 84)">
        <rect width="284" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
        <circle cx="18" cy="17" r="5" fill="#F59E0B" />
        <text x="32" y="21" class="sans item-text" font-weight="600">Question-Evidence Alignment</text>
      </g>

      <g transform="translate(0, 126)">
        <rect width="284" height="24" rx="5" fill="#FFFBEB" />
        <text x="12" y="16" class="sans" font-size="10" font-weight="700" fill="#B45309">
          Any failure triggers immediate Fail-Closed
        </text>
      </g>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 365 530 L 435 530" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrIndigo)" />

  <!-- STAGE 6: Terminal States (Bifurcated: Success vs Fail-Closed) -->
  <g transform="translate(835, 415)">
    <!-- Branch A: Verified Release (Green) -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="320" height="110" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5" />
      <g transform="translate(16, 16)">
        <circle cx="18" cy="18" r="18" fill="#10B981" />
        <path d="M 11 18 L 16 23 L 26 13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text x="46" y="16" class="sans" font-size="13.5" font-weight="900" fill="#065F46">VERIFIED RELEASE</text>
        <text x="46" y="32" class="sans" font-size="11" font-weight="600" fill="#047857">100% Verified Accuracy</text>
      </g>
      <text x="24" y="74" class="sans" font-size="11" font-weight="500" fill="#064E3B">
        - Grounded Numeric Answer &amp; Units
      </text>
      <text x="24" y="92" class="sans" font-size="11" font-weight="500" fill="#064E3B">
        - Full SEC Citation &amp; Document Coordinates
      </text>
    </g>

    <!-- Branch B: Fail-Closed Refusal (Amber/Red) -->
    <g transform="translate(0, 125)" filter="url(#boxShadow)">
      <rect width="320" height="110" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" />
      <g transform="translate(16, 16)">
        <circle cx="18" cy="18" r="18" fill="#F59E0B" />
        <path d="M 18 10 L 24 13 L 24 19 C 24 23 18 26 18 26 C 18 26 12 23 12 19 L 12 13 Z" fill="#FFFFFF" />
        <circle cx="18" cy="18" r="1.5" fill="#D97706" />
        <text x="46" y="16" class="sans" font-size="13.5" font-weight="900" fill="#92400E">FAIL-CLOSED REFUSAL</text>
        <text x="46" y="32" class="sans" font-size="11" font-weight="600" fill="#B45309">100% Safe Abstention</text>
      </g>
      <text x="24" y="74" class="sans" font-size="11" font-weight="500" fill="#78350F">
        - Specific ReasonCode (Missing / Ambiguous)
      </text>
      <text x="24" y="92" class="sans" font-size="11" font-weight="500" fill="#78350F">
        - 0 Hallucination / 0 Incorrect Releases
      </text>
    </g>
  </g>

  <!-- Split Arrows from Stage 5 to Terminal States -->
  <path d="M 760 490 L 795 490 L 795 465 L 830 465" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrGreen)" />
  <path d="M 760 575 L 795 575 L 795 595 L 830 595" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrAmber)" />

</svg>