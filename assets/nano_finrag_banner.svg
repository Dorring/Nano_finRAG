<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="accentTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="glowOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="emeraldOrb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748B" flood-opacity="0.10" />
    </filter>
    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bannerBg)" stroke="#CBD5E1" stroke-width="1.2" />
  
  <!-- Subtle Decorative Grids & Glows -->
  <circle cx="1020" cy="80" r="220" fill="url(#glowOrb)" />
  <circle cx="150" cy="300" r="180" fill="url(#emeraldOrb)" />

  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="380" y1="0" x2="380" y2="260" />
    <line x1="820" y1="0" x2="820" y2="260" />
  </g>

  <!-- Top Badges -->
  <g transform="translate(60, 24)">
    <!-- Production Agentic RAG -->
    <rect width="210" height="30" rx="15" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#2563EB" />
    <text x="28" y="20" class="sans" font-size="12" font-weight="700" fill="#1D4ED8" letter-spacing="0.5px">PRODUCTION AGENTIC RAG</text>

    <!-- Zero Hallucination Guarantee -->
    <g transform="translate(225, 0)">
      <rect width="235" height="30" rx="15" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <path d="M 12 7 L 18 10 L 18 15 C 18 19 12 22 12 22 C 12 22 6 19 6 15 L 6 10 Z" fill="#10B981" />
      <path d="M 9 14.5 L 11 16.5 L 15 12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="26" y="20" class="sans" font-size="12" font-weight="700" fill="#047857" letter-spacing="0.5px">ZERO-HALLUCINATION CONTRACT</text>
    </g>

    <!-- V2 Final Status -->
    <g transform="translate(475, 0)">
      <rect width="165" height="30" rx="15" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#64748B" />
      <text x="28" y="20" class="mono" font-size="11.5" font-weight="600" fill="#475569">V2 FINAL SEALED</text>
    </g>
  </g>

  <!-- Left: Main Title & Subtitle -->
  <g transform="translate(60, 95)">
    <text class="sans" font-size="44" font-weight="900" fill="url(#accentTitle)" letter-spacing="-1.2px">Nano_finRAG</text>
    <text class="sans" font-size="18" font-weight="600" fill="#334155" x="290" y="-8">Financial Precision Engine</text>
    
    <text class="sans" font-size="15" font-weight="400" fill="#64748B" y="32">
      Enterprise Financial Question Answering with SEC 10-K/Q Invariant Binding
    </text>
    
    <!-- Feature Highlights Mini Pills -->
    <g transform="translate(0, 62)">
      <rect width="180" height="26" rx="6" fill="#F1F5F9" />
      <text x="12" y="17" class="sans" font-size="11.5" font-weight="600" fill="#475569">&#9889; Multi-Track Retrieval</text>

      <rect x="190" width="195" height="26" rx="6" fill="#F1F5F9" />
      <text x="202" y="17" class="sans" font-size="11.5" font-weight="600" fill="#475569">&#128290; Deterministic Calculator</text>

      <rect x="395" width="185" height="26" rx="6" fill="#F1F5F9" />
      <text x="407" y="17" class="sans" font-size="11.5" font-weight="600" fill="#475569">&#128737;&#65039; Fail-Closed Security</text>
    </g>
  </g>

  <!-- Right: Visual Architectural Graphic Elements -->
  <g transform="translate(760, 80)">
    <!-- Diagram Mini Pipeline Art -->
    <rect width="380" height="155" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    
    <!-- Header of Mini Diagram -->
    <rect width="380" height="32" rx="12" fill="#F8FAFC" />
    <circle cx="20" cy="16" r="4" fill="#EF4444" />
    <circle cx="34" cy="16" r="4" fill="#F59E0B" />
    <circle cx="48" cy="16" r="4" fill="#10B981" />
    <text x="68" y="20" class="mono" font-size="11" font-weight="700" fill="#64748B">PIPELINE VERIFICATION FLOW</text>

    <!-- Step 1: Input Document -->
    <g transform="translate(25, 52)">
      <rect width="64" height="68" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <path d="M 22 14 L 38 14 L 44 20 L 44 48 L 22 48 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2" />
      <line x1="26" y1="24" x2="38" y2="24" stroke="#2563EB" stroke-width="1.2" />
      <line x1="26" y1="30" x2="40" y2="30" stroke="#2563EB" stroke-width="1.2" />
      <line x1="26" y1="36" x2="34" y2="36" stroke="#2563EB" stroke-width="1.2" />
      <text x="10" y="60" class="sans" font-size="10" font-weight="700" fill="#1E40AF">SEC Filings</text>
    </g>

    <!-- Connector 1 -->
    <polygon points="118,86 112,83 112,89" fill="#64748B" />

    <!-- Step 2: Multi-Track Engine + Reranker -->
    <g transform="translate(126, 52)">
      <rect width="112" height="68" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
      <circle cx="56" cy="24" r="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2" />
      <path d="M 50 26 L 56 18 L 62 26" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="56" y1="18" x2="56" y2="30" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" />
      <text x="14" y="48" class="sans" font-size="10.5" font-weight="800" fill="#6D28D9">RERANK + RRF</text>
      <text x="24" y="60" class="mono" font-size="9.5" font-weight="700" fill="#059669">85.3% RECALL</text>
    </g>

    <!-- Connector 2 -->
    <polygon points="247,86 241,83 241,89" fill="#64748B" />

    <!-- Step 3: Verified Gate -->
    <g transform="translate(254, 52)">
      <rect width="102" height="68" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
      <path d="M 51 14 L 63 19 L 63 29 C 63 36 51 42 51 42 C 51 42 39 36 39 29 L 39 19 Z" fill="#10B981" />
      <path d="M 45 28 L 49 32 L 57 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="13" y="52" class="sans" font-size="10.5" font-weight="800" fill="#065F46">VERIFIED</text>
      <text x="14" y="62" class="mono" font-size="9" font-weight="700" fill="#047857">100% ACCURACY</text>
    </g>

    <!-- Fail-Closed Guard Footnote -->
    <g transform="translate(30, 134)">
      <circle cx="6" cy="6" r="3" fill="#F59E0B" />
      <text x="14" y="9" class="sans" font-size="10" font-weight="600" fill="#78350F">
        Zero hallucination: Barred from LLM math · Fail-closed gate
      </text>
    </g>
  </g>

  <!-- Bottom: 4 Key Indicator Cards -->
  <g transform="translate(60, 276)">
    <!-- Card 1: Verified Accuracy -->
    <g transform="translate(0, 0)" filter="url(#pillShadow)">
      <rect width="255" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect width="5" height="64" rx="2.5" fill="#10B981" />
      <circle cx="36" cy="32" r="18" fill="#ECFDF5" />
      <path d="M 28 32 L 33 37 L 44 26" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="66" y="28" class="sans" font-size="11" font-weight="700" fill="#64748B">VERIFIED ACCURACY</text>
      <text x="66" y="52" class="sans" font-size="22" font-weight="900" fill="#0F172A">100%</text>
      <text x="134" y="50" class="sans" font-size="11" font-weight="600" fill="#059669">0 Incorrect Releases</text>
    </g>

    <!-- Card 2: Structured Rerank -->
    <g transform="translate(275, 0)" filter="url(#pillShadow)">
      <rect width="255" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect width="5" height="64" rx="2.5" fill="#2563EB" />
      <circle cx="36" cy="32" r="18" fill="#EFF6FF" />
      <path d="M 36 21 L 43 32 L 39 32 L 39 42 L 33 42 L 33 32 L 29 32 Z" fill="#2563EB" />
      <text x="66" y="28" class="sans" font-size="11" font-weight="700" fill="#64748B">STRUCTURED RERANK</text>
      <text x="66" y="52" class="sans" font-size="22" font-weight="900" fill="#0F172A">85.3%</text>
      <text x="144" y="50" class="sans" font-size="11" font-weight="600" fill="#2563EB">Top-5 Recall (+34.6%)</text>
    </g>

    <!-- Card 3: Deterministic Calculator -->
    <g transform="translate(550, 0)" filter="url(#pillShadow)">
      <rect width="255" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect width="5" height="64" rx="2.5" fill="#7C3AED" />
      <circle cx="36" cy="32" r="18" fill="#F5F3FF" />
      <rect x="28" y="22" width="16" height="20" rx="3" fill="none" stroke="#7C3AED" stroke-width="1.8" />
      <line x1="31" y1="27" x2="41" y2="27" stroke="#7C3AED" stroke-width="1.5" />
      <circle cx="32" cy="33" r="1" fill="#7C3AED" />
      <circle cx="36" cy="33" r="1" fill="#7C3AED" />
      <circle cx="40" cy="33" r="1" fill="#7C3AED" />
      <circle cx="32" cy="38" r="1" fill="#7C3AED" />
      <circle cx="36" cy="38" r="1" fill="#7C3AED" />
      <circle cx="40" cy="38" r="1" fill="#7C3AED" />
      <text x="66" y="28" class="sans" font-size="11" font-weight="700" fill="#64748B">DECIMAL CALCULATOR</text>
      <text x="66" y="52" class="sans" font-size="20" font-weight="900" fill="#0F172A">9 Ops</text>
      <text x="130" y="50" class="sans" font-size="11" font-weight="600" fill="#7C3AED">Zero LLM Math</text>
    </g>

    <!-- Card 4: Citation Fidelity -->
    <g transform="translate(825, 0)" filter="url(#pillShadow)">
      <rect width="255" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
      <rect width="5" height="64" rx="2.5" fill="#0D9488" />
      <circle cx="36" cy="32" r="18" fill="#F0FDFA" />
      <path d="M 28 22 L 40 22 L 44 26 L 44 42 L 28 42 Z" fill="none" stroke="#0D9488" stroke-width="1.6" />
      <circle cx="34" cy="32" r="3" fill="#0D9488" />
      <line x1="36" y1="34" x2="41" y2="39" stroke="#0D9488" stroke-width="1.6" />
      <text x="66" y="28" class="sans" font-size="11" font-weight="700" fill="#64748B">CITATION FIDELITY</text>
      <text x="66" y="52" class="sans" font-size="22" font-weight="900" fill="#0F172A">96.0%</text>
      <text x="144" y="50" class="sans" font-size="11" font-weight="600" fill="#0D9488">Exact Coordinate</text>
    </g>
  </g>
</svg>