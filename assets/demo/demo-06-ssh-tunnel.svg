<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#e0e0e0" text-anchor="middle">Online Serving — Service Status Dashboard</text>
  <line x1="150" y1="55" x2="650" y2="55" stroke="#4ecdc4" stroke-width="1" opacity="0.5"/>

  <!-- Service 1: Model -->
  <rect x="40" y="80" width="230" height="180" rx="10" fill="#12122a" stroke="#2a2a4e" stroke-width="1" filter="url(#shadow)"/>
  <rect x="40" y="80" width="230" height="40" rx="10" fill="url(#greenGrad)"/>
  <rect x="40" y="112" width="230" height="8" fill="url(#greenGrad)"/>
  <text x="155" y="106" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Model Service</text>

  <circle cx="155" cy="160" r="12" fill="#4ecdc4" opacity="0.9"/>
  <text x="155" y="164" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a2e" text-anchor="middle">●</text>
  <text x="155" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4ecdc4" text-anchor="middle">HEALTHY</text>

  <text x="155" y="215" font-family="monospace" font-size="10" fill="#a0a0c0" text-anchor="middle">Port: 18001</text>
  <text x="155" y="235" font-family="monospace" font-size="10" fill="#a0a0c0" text-anchor="middle">PID: 28471</text>
  <text x="155" y="252" font-family="monospace" font-size="10" fill="#606080" text-anchor="middle">tmux: nano-finance-model</text>

  <!-- Service 2: Backend -->
  <rect x="285" y="80" width="230" height="180" rx="10" fill="#12122a" stroke="#2a2a4e" stroke-width="1" filter="url(#shadow)"/>
  <rect x="285" y="80" width="230" height="40" rx="10" fill="url(#greenGrad)"/>
  <rect x="285" y="112" width="230" height="8" fill="url(#greenGrad)"/>
  <text x="400" y="106" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Backend Service</text>

  <circle cx="400" cy="160" r="12" fill="#4ecdc4" opacity="0.9"/>
  <text x="400" y="164" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a2e" text-anchor="middle">●</text>
  <text x="400" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4ecdc4" text-anchor="middle">HEALTHY</text>

  <text x="400" y="215" font-family="monospace" font-size="10" fill="#a0a0c0" text-anchor="middle">Port: 18002</text>
  <text x="400" y="235" font-family="monospace" font-size="10" fill="#a0a0c0" text-anchor="middle">PID: 28492</text>
  <text x="400" y="252" font-family="monospace" font-size="10" fill="#606080" text-anchor="middle">tmux: nano-finance-backend</text>

  <!-- Service 3: Frontend -->
  <rect x="530" y="80" width="230" height="180" rx="10" fill="#12122a" stroke="#2a2a4e" stroke-width="1" filter="url(#shadow)"/>
  <rect x="530" y="80" width="230" height="40" rx="10" fill="url(#greenGrad)"/>
  <rect x="530" y="112" width="230" height="8" fill="url(#greenGrad)"/>
  <text x="645" y="106" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Frontend Service</text>

  <circle cx="645" cy="160" r="12" fill="#4ecdc4" opacity="0.9"/>
  <text x="645" y="164" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1a1a2e" text-anchor="middle">●</text>
  <text x="645" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4ecdc4" text-anchor="middle">HEALTHY</text>

  <text x="645" y="215" font-family="monospace" font-size="10" fill="#a0a0c0" text-anchor="middle">Port: 18003</text>
  <text x="645" y="235" font-family="monospace" font-size="10" fill="#a0a0c0" text-anchor="middle">PID: 28503</text>
  <text x="645" y="252" font-family="monospace" font-size="10" fill="#606080" text-anchor="middle">tmux: nano-finance-frontend</text>

  <!-- Divider -->
  <line x1="40" y1="290" x2="760" y2="290" stroke="#2a2a4e" stroke-width="1"/>

  <!-- Health Summary -->
  <rect x="40" y="310" width="720" height="55" rx="8" fill="#0a1a1a" stroke="#4ecdc4" stroke-width="1"/>
  <text x="400" y="338" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4ecdc4" text-anchor="middle">✓ All 3 Services Healthy</text>
  <text x="400" y="356" font-family="monospace" font-size="10" fill="#a0a0c0" text-anchor="middle">Health checks: 3/3 | Smoke tests: 12/12 | SSE streaming: OK</text>

  <!-- SSH Tunnel info -->
  <rect x="40" y="380" width="720" height="35" rx="8" fill="#1a1a3a" stroke="#0f3460" stroke-width="1"/>
  <text x="400" y="403" font-family="monospace" font-size="11" fill="#e0e0e0" text-anchor="middle">SSH Tunnel: ssh -N -L 18003:127.0.0.1:18003 -L 18002:127.0.0.1:18002 user@server</text>

  <!-- Placeholder indicator -->
  <rect x="600" y="460" width="160" height="24" rx="4" fill="#e94560" opacity="0.7"/>
  <text x="680" y="477" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[ Placeholder Screenshot ]</text>
</svg>
