<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9c46a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="safeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#e0e0e0" text-anchor="middle">Validation Block — Unit/Period Ambiguity Detection</text>
  <line x1="150" y1="55" x2="650" y2="55" stroke="#e94560" stroke-width="1" opacity="0.5"/>

  <!-- Warning Panel -->
  <rect x="50" y="80" width="700" height="80" rx="10" fill="#1a0000" stroke="#e94560" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e94560">⚠  Validation Blocked</text>
  <text x="80" y="132" font-family="Arial, sans-serif" font-size="12" fill="#c0a0a0">Question: "What was the revenue in 2025?" → Operand has unit ambiguity (¥ vs USD vs RMB)</text>

  <!-- Ambiguity details -->
  <rect x="50" y="180" width="700" height="150" rx="10" fill="#12122a" stroke="#e9c46a" stroke-width="1"/>

  <text x="75" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e9c46a">Detected Ambiguities:</text>

  <rect x="75" y="228" width="650" height="30" rx="5" fill="#1a1a3a"/>
  <text x="90" y="248" font-family="monospace" font-size="11" fill="#e0e0e0">• Unit ambiguity: Revenue reported as "¥12,847M" but also "USD 1,850M" in document</text>

  <rect x="75" y="268" width="650" height="30" rx="5" fill="#1a1a3a"/>
  <text x="90" y="288" font-family="monospace" font-size="11" fill="#e0e0e0">• Period ambiguity: "2025" could be FY2025 or CY2025 (document uses both)</text>

  <rect x="75" y="308" width="650" height="18" rx="5" fill="#1a1a3a"/>
  <text x="90" y="322" font-family="monospace" font-size="11" fill="#e0e0e0">• Scale ambiguity: Values in millions vs thousands on different pages</text>

  <!-- Safe Fallback -->
  <rect x="50" y="350" width="700" height="65" rx="10" fill="#0a1a1a" stroke="#4ecdc4" stroke-width="1.5"/>
  <rect x="50" y="350" width="700" height="35" rx="10" fill="url(#safeGrad)"/>
  <rect x="50" y="377" width="700" height="38" rx="10" fill="url(#safeGrad)" opacity="0.05"/>
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓ Safe Fallback Applied</text>
  <text x="400" y="398" font-family="Arial, sans-serif" font-size="12" fill="#c0e0e0" text-anchor="middle">No ambiguous calculation performed. System returned safe refusal message.</text>

  <!-- Footer -->
  <text x="400" y="445" font-family="Arial, sans-serif" font-size="11" fill="#606080" text-anchor="middle">Fail-closed · No guesswork · Unit/Scale/Period validation before calculation</text>

  <!-- Placeholder indicator -->
  <rect x="600" y="460" width="160" height="24" rx="4" fill="#e94560" opacity="0.7"/>
  <text x="680" y="477" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[ Placeholder Screenshot ]</text>
</svg>
