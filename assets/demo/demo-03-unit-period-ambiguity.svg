<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="calcBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#e0e0e0" text-anchor="middle">Financial Calculation — Deterministic Calculator Output</text>
  <line x1="150" y1="55" x2="650" y2="55" stroke="#533483" stroke-width="1" opacity="0.5"/>

  <!-- User Question -->
  <rect x="340" y="80" width="420" height="40" rx="8" fill="#0f3460" opacity="0.6"/>
  <text x="355" y="105" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0">Calculate the revenue growth from 2024 to 2025.</text>

  <!-- Calculation Panel -->
  <rect x="60" y="145" width="680" height="270" rx="10" fill="url(#calcBox)" filter="url(#shadow)" stroke="#2a2a5e" stroke-width="1"/>

  <!-- Label -->
  <text x="80" y="172" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#533483">Deterministic Financial Calculator</text>

  <!-- Operation -->
  <rect x="80" y="190" width="200" height="28" rx="5" fill="#1a1a3a" stroke="#533483" stroke-width="1"/>
  <text x="180" y="210" font-family="monospace" font-size="12" fill="#4ecdc4" text-anchor="middle">Operation: growth_rate</text>

  <!-- Operand bindings -->
  <text x="80" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0c0d0">Operand Bindings:</text>

  <rect x="80" y="268" width="310" height="24" rx="4" fill="#1a1a3a"/>
  <text x="90" y="284" font-family="monospace" font-size="11" fill="#a0a0c0">base  = ¥10,234M  (2024, AR p.41)</text>

  <rect x="80" y="298" width="310" height="24" rx="4" fill="#1a1a3a"/>
  <text x="90" y="314" font-family="monospace" font-size="11" fill="#a0a0c0">target= ¥12,847M  (2025, AR p.42)</text>

  <!-- Result -->
  <rect x="440" y="240" width="280" height="100" rx="8" fill="#1a1a3a" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="580" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6090c0" text-anchor="middle">Result</text>
  <text x="580" y="300" font-family="monospace" font-size="20" font-weight="bold" fill="#4ecdc4" text-anchor="middle">+25.53%</text>
  <text x="580" y="325" font-family="monospace" font-size="11" fill="#a0a0c0" text-anchor="middle">Decimal precision · fail-closed</text>

  <!-- Footer stats -->
  <text x="80" y="400" font-family="monospace" font-size="10" fill="#606080">9 deterministic operations | Decimal-based | Evidence binding required</text>

  <!-- Placeholder indicator -->
  <rect x="600" y="460" width="160" height="24" rx="4" fill="#e94560" opacity="0.7"/>
  <text x="680" y="477" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[ Placeholder Screenshot ]</text>
</svg>
