<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="msgUser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="msgAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#e0e0e0" text-anchor="middle">Document Q&A — Question with Source Citations</text>
  <line x1="150" y1="55" x2="650" y2="55" stroke="#0f3460" stroke-width="1" opacity="0.5"/>

  <!-- Chat Container -->
  <rect x="40" y="75" width="720" height="330" rx="8" fill="#12122a" stroke="#2a2a4e" stroke-width="1"/>

  <!-- User Message -->
  <rect x="320" y="95" width="420" height="50" rx="8" fill="url(#msgUser)" filter="url(#shadow)" stroke="#0f3460" stroke-width="1"/>
  <text x="335" y="115" font-family="Arial, sans-serif" font-size="11" fill="#6090c0" text-anchor="start">You</text>
  <text x="335" y="133" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="start">What was the reported revenue in 2025?</text>

  <!-- AI Response -->
  <rect x="60" y="165" width="680" height="220" rx="8" fill="url(#msgAI)" filter="url(#shadow)" stroke="#2a2a4e" stroke-width="1"/>
  <text x="75" y="185" font-family="Arial, sans-serif" font-size="11" fill="#6090c0" text-anchor="start">Assistant</text>

  <!-- Answer text -->
  <text x="75" y="210" font-family="Arial, sans-serif" font-size="13" fill="#e0e0e0" text-anchor="start">The reported revenue for fiscal year 2025 was <tspan fill="#4ecdc4" font-weight="bold">¥12,847 million</tspan>.</text>

  <!-- Source citations -->
  <rect x="75" y="230" width="650" height="140" rx="6" fill="#1a1a3a" stroke="#2a2a5e" stroke-width="1"/>
  <text x="85" y="252" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6090c0">Sources:</text>

  <text x="85" y="275" font-family="Arial, sans-serif" font-size="11" fill="#a0a0c0">[1] Annual Report 2025, p.42 — "Total revenue reached ¥12,847 million..."</text>
  <rect x="80" y="262" width="6" height="6" rx="1" fill="#4ecdc4"/>

  <text x="85" y="300" font-family="Arial, sans-serif" font-size="11" fill="#a0a0c0">[2] Annual Report 2025, p.15 — "Revenue breakdown by segment..."</text>
  <rect x="80" y="287" width="6" height="6" rx="1" fill="#e94560"/>

  <text x="85" y="325" font-family="Arial, sans-serif" font-size="11" fill="#a0a0c0">[3] Financial Summary 2025, p.3 — "Consolidated revenue figures..."</text>
  <rect x="80" y="312" width="6" height="6" rx="1" fill="#533483"/>

  <!-- Model info -->
  <text x="75" y="365" font-family="monospace" font-size="10" fill="#606080">Chunks retrieved: 5 | Top-K: 3 | RRF + Reranker</text>

  <!-- Placeholder indicator -->
  <rect x="600" y="460" width="160" height="24" rx="4" fill="#e94560" opacity="0.7"/>
  <text x="680" y="477" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">[ Placeholder Screenshot ]</text>
</svg>
